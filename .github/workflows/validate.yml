name: Validate skill package
on:
  push:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  validate:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-24.04
            python: '3.12'
            node: '22'
          - os: macos-14
            python: '3.12'
            node: '22'
          - os: macos-14
            python: '3.10'
            node: '18'
          - os: windows-2022
            python: '3.12'
            node: '22'
          - os: windows-2022
            python: '3.10'
            node: '18'
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        # Git Bash on Windows, so "bash" is not the WSL launcher.
        shell: bash
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
          cache: npm
      - run: python -m pip install -r requirements-dev.txt
      - run: npm ci --no-audit --no-fund
      - run: python tools/check.py
      - run: python -m unittest discover -s tests -v
      - run: node --test tests/level.test.js
      - name: Native read-only smoke (Windows, macOS)
        if: runner.os != 'Linux'
        run: python tools/smoke.py
      - name: Native browser previews on the runner's own profiles (Windows, macOS)
        if: runner.os != 'Linux'
        # Read-only: scans and previews work on snapshot copies. 0 = no hits,
        # 1 = hits (scan only); anything else fails the job.
        run: |
          python scripts/browser_scan.py || [ $? -eq 1 ]
          python scripts/chrome_purge.py
          node scripts/ls_purge.js
