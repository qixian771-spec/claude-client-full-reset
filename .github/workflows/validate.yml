name: Validate skill package
on:
  push:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  validate:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-24.04
            python: '3.12'
            node: '22'
          - os: macos-14
            python: '3.12'
            node: '22'
          - os: macos-14
            python: '3.10'
            node: '18'
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
          cache: npm
      - run: python -m pip install -r requirements-dev.txt
      - run: npm ci --no-audit --no-fund
      - run: python tools/check.py
      - run: python -m unittest discover -s tests -v
      - run: node --test tests/level.test.js
